<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZRV MINER PLATFORM</title>
    <style>
        :root {
            --bg-color: #050b1e;
            --neon-blue: #00d2ff;
            --neon-yellow: #ffd700;
            --btn-yellow: #ffcc00;
            --text-gray: #8f9bb3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Фіксована верхня панель балансу */
        .header {
            text-align: center;
            padding: 20px 10px 10px;
        }
        .assets-title {
            font-size: 12px;
            color: var(--text-gray);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .main-balance {
            font-size: 32px;
            font-weight: bold;
            color: var(--neon-yellow);
            margin: 5px 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        .sub-balances {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 11px;
        }
        .balance-chip {
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }
        .balance-chip span {
            color: var(--neon-yellow);
        }

        /* Контейнер для сторінок */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            padding-bottom: 90px; /* щоб не перекривало навігацію */
        }

        .page {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .page.active {
            display: flex;
        }

        /* Елементи вкладки MINE */
        .tap-effect-zone {
            position: relative;
            margin: 40px 0;
        }
        .coin-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe866 0%, #ffc400 70%, #b38600 100%);
            border: 8px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.6), inset 0 0 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #050b1e;
            cursor: pointer;
            transition: transform 0.05s;
        }
        .coin-btn:active {
            transform: scale(0.95);
        }
        .action-btn {
            width: 90%;
            max-width: 340px;
            background: linear-gradient(180deg, #ffe53b 0%, #ff2525 100%); /* Тимчасовий яскравий градієнт для тесту */
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
        }
        .action-btn:disabled {
            background: #555;
            color: #aaa;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Спливаючі цифри при тапі */
        .floating-text {
            position: absolute;
            color: var(--neon-blue);
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(0.8); }
        }

        /* Шаблони для інших сторінок */
        .list-container {
            width: 100%;
            max-width: 400px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(0,210,255,0.1);
            border-radius: 15px;
            padding: 15px;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .list-item:last-child { border: none; }
        .go-btn {
            background: var(--btn-yellow);
            color: #000;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Нижня навігація (Menu) */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: #07112c;
            border-top: 2px solid var(--neon-blue);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-gray);
            font-size: 11px;
            text-decoration: none;
            cursor: pointer;
            flex: 1;
        }
        .nav-item span:first-child {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .nav-item.active {
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯ ПАНЕЛЬ З БАЛАНСОМ -->
    <div class="header">
        <div class="assets-title">Assets</div>
        <div class="main-balance" id="total-balance">0.0000 ZRV</div>
        <div class="sub-balances">
            <div class="balance-chip">HOLDING: <span id="holding-balance">0.0000</span></div>
            <div class="balance-chip">POOL: <span id="pool-balance">0.0000</span></div>
        </div>
    </div>

    <!-- КОНТЕНТ СТОРІНОК -->
    <div class="content">
        
        <!-- 1. MINE PAGE -->
        <div id="page-mine" class="page active">
            <div class="tap-effect-zone">
                <div class="coin-btn" id="coin-target">ZRV</div>
            </div>
            <button class="action-btn" id="mining-btn">Start Mining (8H)</button>
        </div>

        <!-- 2. TASKS PAGE -->
        <div id="page-tasks" class="page">
            <h2 style="margin-bottom: 15px;">Tasks</h2>
            <div class="list-container">
                <div class="list-item">
                    <div>YouTube Like & Comment<br><small style="color:var(--neon-yellow)">+10 ZRV</small></div>
                    <button class="go-btn" onclick="completeTask(10)">Go</button>
                </div>
                <div class="list-item">
                    <div>X Retweet<br><small style="color:var(--neon-yellow)">+5 ZRV</small></div>
                    <button class="go-btn" onclick="completeTask(5)">Go</button>
                </div>
            </div>
        </div>

        <!-- 3. MINERS PAGE -->
        <div id="page-miners" class="page">
            <h2 style="margin-bottom: 10px;">Miners</h2>
            <div style="font-size: 18px; color: var(--neon-blue); margin-bottom: 15px;" id="miner-level-txt">Level 1 / 500</div>
            <button class="action-btn" id="upgrade-btn" style="width:200px;">Upgrade</button>
        </div>

        <!-- 4. FRIENDS PAGE -->
        <div id="page-friends" class="page">
            <h2 style="margin-bottom: 15px;">Invite Friends</h2>
            <div class="list-container" style="text-align: center;">
                <input type="text" id="ref-link" value="https://t.me" readonly style="width: 100%; padding: 10px; background: #000; border: 1px solid var(--neon-blue); color: #fff; text-align: center; border-radius: 8px; margin-bottom: 15px;">
                <button class="action-btn" onclick="copyLink()">Copy Link</button>
            </div>
        </div>

        <!-- 5. PROFILE PAGE -->
        <div id="page-profile" class="page">
            <h2 style="margin-bottom: 20px;">User Profile</h2>
            <div class="list-container">
                <div class="list-item"><span>User ID:</span> <strong id="user-id">574839201</strong></div>
                <div class="list-item"><span>Status:</span> <span style="color: #00ffcc; font-weight: bold;">Account Verification: Verified</span></div>
            </div>
        </div>

    </div>

    <!-- НИЖНЯ НАВІГАЦІЙНА ПАНЕЛЬ -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('mine', this)"><span>⛏️</span><span>Mine</span></div>
        <div class="nav-item" onclick="switchPage('tasks', this)"><span>📝</span><span>Tasks</span></div>
        <div class="nav-item" onclick="switchPage('miners', this)"><span>⚡</span><span>Miners</span></div>
        <div class="nav-item" onclick="switchPage('friends', this)"><span>👥</span><span>Friends</span></div>
        <div class="nav-item" onclick="switchPage('profile', this)"><span>👤</span><span>Profile</span></div>
    </div>

    <!-- ЛОГІКА ДОДАТКУ (JAVASCRIPT) -->
    <script>
        // Ініціалізація змінних стану гри
        let balance = 0.0000;
        let holding = 0.0000;
        let pool = 0.0000;
        let minerLevel = 1;
        let miningTimer = null;
