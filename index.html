<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ZRV Miner</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #1e1e2f 0%, #0f0f1a 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .balance-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .balance-label {
            font-size: 16px;
            color: #8a8ab0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .balance-value {
            font-size: 48px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            margin-top: 5px;
        }

        .coin-container {
            position: relative;
            width: 220px;
            height: 220px;
            perspective: 1000px;
        }

        .coin {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #00ffcc 0%, #0088cc 100%);
            border-radius: 50%;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.05s ease;
            touch-action: manipulation;
        }

        .coin:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="balance-container">
        <div class="balance-label">Баланс ZRV</div>
        <div id="balance" class="balance-value">0</div>
    </div>

    <div class="coin-container">
        <div id="coinBtn" class="coin">ZRV</div>
    </div>

    <script>
        // Ініціалізація Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Розгортаємо додаток на весь екран смартфона

        let score = 0;
        const balanceEl = document.getElementById('balance');
        const coinBtn = document.getElementById('coinBtn');

        coinBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Запобігає випадковому зуму екрана при кліках
            score += 1;
            balanceEl.textContent = score;
            
            // Створюємо вібровідгук на телефоні при кожному тапі
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });
    </script>
</body>
</html>
