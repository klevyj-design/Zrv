<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ZRV Miner v2</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #1e1e2f 0%, #0f0f1a 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Шапка з балансом */
        .header {
            text-align: center;
            padding-top: 30px;
        }
        .balance-label {
            font-size: 14px;
            color: #8a8ab0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .balance-value {
            font-size: 42px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            margin-top: 5px;
        }

        /* Контентні зони (вкладки) */
        .tab-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        .tab-content.active {
            display: flex;
        }

        /* Велика кнопка майнінгу */
        .mining-btn {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #00ffcc 0%, #0088cc 100%);
            border-radius: 50%;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease;
            text-align: center;
        }
        .mining-btn:active {
            transform: scale(0.96);
        }
        .mining-btn .title {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }
        .mining-btn .status {
            font-size: 14px;
            margin-top: 8px;
            color: #e0e0ff;
        }

        /* Списки для Бустів та Друзів */
        .card-list {
            width: 100%;
            max-width: 320px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-info h4 {
            margin: 0;
            font-size: 16px;
            color: #fff;
        }
        .card-info p {
            margin: 4px 0 0 0;
            font-size: 12px;
            color: #8a8ab0;
        }
        .btn-action {
            background: #00ffcc;
            color: #0f0f1a;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Нижня панель навігації (Таббар) */
        .nav-bar {
            background: rgba(15, 15, 26, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            backdrop-filter: blur(10px);
        }
        .nav-item {
            color: #8a8ab0;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            flex-grow: 1;
        }
        .nav-item.active {
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
    </style>
</head>
<body>

    <!-- Загальна шапка з балансом -->
    <div class="header">
        <div class="balance-label">Баланс ZRV</div>
        <div id="totalBalance" class="balance-value">0</div>
    </div>

    <!-- ВКЛАДКА 1: МАЙНІНГ -->
    <div id="tab-mining" class="tab-content active">
        <div id="startMiningBtn" class="mining-btn">
            <div id="btnTitle" class="title">СТАРТ</div>
            <div id="btnTimer" class="status">Майнінг 8 годин</div>
        </div>
    </div>

    <!-- ВКЛАДКА 2: БУСТИ -->
    <div id="tab-boosts" class="tab-content">
        <h3>Доступні Покращення</h3>
        <div class="card-list">
            <div class="card">
                <div class="card-info">
                    <h4>Швидкість х2</h4>
                    <p>Ціна: 500 ZRV</p>
                </div>
                <button class="btn-action">Купити</button>
            </div>
            <div class="card">
                <div class="card-info">
                    <h4>Супер Майнер</h4>
                    <p>Ціна: 2000 ZRV</p>
                </div>
                <button class="btn-action">Купити</button>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА 3: ДРУЗІ -->
    <div id="tab-friends" class="tab-content">
        <h3>Запросити друзів</h3>
        <p style="color: #8a8ab0; text-align: center; font-size: 14px;">Отримуйте +10% від майнінгу ваших друзів!</p>
        <div class="card-list" style="margin-top: 15px;">
            <button class="btn-action" style="width: 100%; padding: 12px;" onclick="shareLink()">🔗 Скопіювати посилання</button>
        </div>
    </div>

    <!-- Нижня навігація (Кнопки меню) -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('mining')">⛏️ Майнінг</div>
        <div class="nav-item" onclick="switchTab('boosts')">⚡ Бусти</div>
        <div class="nav-item" onclick="switchTab('friends')">👥 Друзі</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const urlParams = new URLSearchParams(window.location.search);
        let currentBalance = parseInt(urlParams.get('balance')) || 0;
        let miningEndTime = parseInt(urlParams.get('mining_end')) || 0; 
        
        const totalBalanceEl = document.getElementById('totalBalance');
        const startBtn = document.getElementById('startMiningBtn');
        const btnTitle = document.getElementById('btnTitle');
        const btnTimer = document.getElementById('btnTimer');

        totalBalanceEl.textContent = currentBalance;
        let timerInterval;

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function checkMiningStatus() {
            const now = Math.floor(Date.now() / 1000);
            
            if (miningEndTime > 0 && now < miningEndTime) {
                startBtn.style.background = "linear-gradient(135deg, #555 0%, #222 100%)";
                startBtn.style.pointerEvents = "none";
                updateTimer();
                timerInterval = setInterval(updateTimer, 1000);
            } else if (miningEndTime > 0 && now >= miningEndTime) {
                btnTitle.textContent = "CLAIM";
                btnTimer.textContent = "+100 ZRV готово";
                startBtn.style.background = "linear-gradient(135deg, #ffcc00 0%, #ff6600 100%)";
                startBtn.style.pointerEvents = "auto";
            } else {
                btnTitle.textContent = "СТАРТ";
                btnTimer.textContent = "Майнінг 8 годин";
                startBtn.style.background = "linear-gradient(135deg, #00ffcc 0%, #0088cc 100%)";
                startBtn.style.pointerEvents = "auto";
            }
        }

        function updateTimer() {
            const now = Math.floor(Date.now() / 1000);
            const timeLeft = miningEndTime - now;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                checkMiningStatus();
                return;
            }

            const hrs = Math.floor(timeLeft / 3600).toString().padStart(2, '0');
            const mins = Math.floor((timeLeft % 3600) / 60).toString().padStart(2, '0');
            const secs = (timeLeft % 60).toString().padStart(2, '0');
            
            btnTitle.textContent = `${hrs}:${mins}:${secs}`;
            btnTimer.textContent = "Майнінг активний";
        }

        startBtn.addEventListener('click', () => {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            if (btnTitle.textContent === "СТАРТ") {
                tg.sendData(JSON.stringify({ action: "start_mining" }));
                tg.close(); 
            } else if (btnTitle.textContent === "CLAIM") {
                tg.sendData(JSON.stringify({ action: "claim_mining" }));
                tg.close();
            }
        });

        function shareLink() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            alert("Посилання скопійовано! Надішліть його другу.");
        }

        checkMiningStatus();
    </script>
</body>
</html>
