<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZRV MINER PLATFORM</title>
    <script src="https://telegram.org"></script>
    <style>
        :root { --bg-color: #050b1e; --neon-blue: #00d2ff; --neon-yellow: #ffd700; --btn-yellow: #ffcc00; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; user-select: none; -webkit-user-select: none; }
        body { background-color: var(--bg-color); color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; text-align: center; }
        .header { padding: 20px 10px; flex-shrink: 0; }
        .main-balance { font-size: 32px; font-weight: bold; color: var(--neon-yellow); margin: 5px 0; }
        .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .page { display: none; width: 100%; }
        .page.active { display: flex; flex-direction: column; align-items: center; }
        .coin-btn { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, #ffe866 0%, #ffc400 70%); border: 8px solid var(--neon-blue); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; color: #050b1e; margin: 30px 0; }
        .action-btn { background: var(--btn-yellow); color: #000; border: none; padding: 15px 30px; border-radius: 10px; font-size: 16px; font-weight: bold; text-transform: uppercase; }
        .list-container { width: 100%; max-width: 400px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: left; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: #07112c; border-top: 2px solid var(--neon-blue); display: flex; justify-content: space-around; align-items: center; }
        .nav-item { color: #8f9bb3; font-size: 12px; cursor: pointer; padding: 10px; flex: 1; }
        .nav-item.active { color: var(--neon-blue); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <p style="color: #8f9bb3; font-size: 12px;">TOTAL BALANCE</p>
        <div class="main-balance" id="balance-txt">0.0000 ZRV</div>
    </div>

    <div class="content">
        <!-- Сторінка 1: Mine -->
        <div id="p-mine" class="page active">
            <div class="coin-btn" id="coin-element">ZRV</div>
            <button class="action-btn" id="mine-btn">START MINING</button>
        </div>

        <!-- Сторінка 2: Tasks -->
        <div id="p-tasks" class="page">
            <h2 style="margin-bottom: 15px;">Tasks</h2>
            <div class="list-container">
                <p>YouTube Task (+10 ZRV)</p>
                <p style="margin-top: 10px;">X Task (+5 ZRV)</p>
            </div>
        </div>

        <!-- Сторінка 3: Miners -->
        <div id="p-miners" class="page">
            <h2>Miners</h2>
            <p style="margin: 15px 0;" id="lvl-txt">Level 1 / 500</p>
            <button class="action-btn" id="up-btn">Upgrade</button>
        </div>

        <!-- Сторінка 4: Friends -->
        <div id="p-friends" class="page">
            <h2>Friends</h2>
            <p style="margin-top: 15px;">Invite Link: https://t.me</p>
        </div>

        <!-- Сторінка 5: Profile -->
        <div id="p-profile" class="page">
            <h2>Profile</h2>
            <p style="margin-top: 15px;">Status: Verified</p>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" id="n-mine">Mine</div>
        <div class="nav-item" id="n-tasks">Tasks</div>
        <div class="nav-item" id="n-miners">Miners</div>
        <div class="nav-item" id="n-friends">Friends</div>
        <div class="nav-item" id="n-profile">Profile</div>
    </div>

    <script>
        // Ініціалізація Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        var score = 0.0000;
        var lvl = 1;

        // Проста функція кліку по монеті
        var clickZone = document.getElementById("coin-element");
        if (clickZone) {
            clickZone.onclick = function() {
                score = score + 0.0001;
                document.getElementById("balance-txt").innerText = score.toFixed(4) + " ZRV";
            };
        }

        // Проста функція перемикання вкладок
        function showPage(id) {
            var pages = ["mine", "tasks", "miners", "friends", "profile"];
            for (var i = 0; i < pages.length; i++) {
                document.getElementById("p-" + pages[i]).style.display = "none";
                document.getElementById("n-" + pages[i]).className = "nav-item";
            }
            document.getElementById("p-" + id).style.display = "block";
            document.getElementById("n-" + id).className = "nav-item active";
        }

        document.getElementById("n-mine").onclick = function() { showPage("mine"); };
        document.getElementById("n-tasks").onclick = function() { showPage("tasks"); };
        document.getElementById("n-miners").onclick = function() { showPage("miners"); };
        document.getElementById("n-friends").onclick = function() { showPage("friends"); };
        document.getElementById("n-profile").onclick = function() { showPage("profile"); };

        // Кнопка покращення
        document.getElementById("up-btn").onclick = function() {
            if (lvl < 500) {
                lvl = lvl + 1;
                document.getElementById("lvl-txt").innerText = "Level " + lvl + " / 500";
            }
        };
    </script>
</body>
</html>
